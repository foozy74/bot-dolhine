events { worker_connections 1024; }

http {
    upstream dolphin_backend {
        server dolphin-bot:8000;
    }
    
    upstream dolphin_frontend {
        server dolphin-frontend:80;
    }

    server {
        listen 80;
        server_name _;

        # Basic Auth für alle Endpunkte standardmäßig aktivieren
        auth_basic           "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # Unauthenticated Healthchecks für Coolify & Docker
        location = /health {
            auth_basic off;
            access_log off;
            return 200 "healthy\n";
        }

        location = /api/health {
            auth_basic off;
            proxy_pass         http://dolphin_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # WebSocket support für API
        location /api/ws {
            proxy_pass         http://dolphin_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # API endpoints
        location /api {
            proxy_pass         http://dolphin_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Frontend (React App)
        location / {
            proxy_pass       http://dolphin_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}